<!DOCTYPE html>
<html>
<head>

</head>
<body class="bg-gray-200 h-screen w-screen flex items-center justify-center">

<div class="fixed left-[50%] top-[50%] z-50 translate-x-[-50%] translate-y-[-50%] border shadow-lg duration-200 w-[95vw] max-w-[720px] p-0 flex flex-col gap-0 max-h-[90vh] overflow-hidden bg-background sm:rounded-2xl bg-white">
  
  <div class="px-6 py-5 border-b shrink-0 bg-gray-100">
    <h2 class="text-xl font-semibold">Header</h2>
  </div>

  <form class="flex flex-col flex-1 min-h-0 overflow-hidden">
    <div class="flex-1 overflow-y-auto">
      <div class="p-6 h-[2000px] bg-red-100">
        Very tall content
      </div>
    </div>
    <div class="px-6 py-5 border-t shrink-0 bg-gray-100 flex justify-between items-center">
      Footer
    </div>
  </form>
  
  <!-- close button -->
  <button class="absolute right-4 top-4">X</button>
</div>

</html>
